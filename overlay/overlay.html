<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HS Tracker</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="app">

    <!-- ヘッダー -->
    <div class="header">
      <span class="header-icon">◈</span>
      <span class="header-title">HS TRACKER</span>
      <span class="header-badge" id="mode-badge">DM</span>
    </div>

    <!-- DANGER バナー（閾値以下で展開） -->
    <div class="danger-banner" id="danger-banner">
      <span class="bolt" id="bolt-left">
        <svg viewBox="0 0 12 20" width="12" height="20" xmlns="http://www.w3.org/2000/svg">
          <polygon points="7,0 2,11 6,11 5,20 10,9 6,9" fill="currentColor"/>
        </svg>
      </span>
      <span class="danger-text">DANGER</span>
      <span class="bolt" id="bolt-right">
        <svg viewBox="0 0 12 20" width="12" height="20" xmlns="http://www.w3.org/2000/svg">
          <polygon points="7,0 2,11 6,11 5,20 10,9 6,9" fill="currentColor"/>
        </svg>
      </span>
    </div>

    <!-- 円形ゲージ -->
    <div class="gauge-wrap">
      <svg class="gauge-svg" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <!-- 外装リング -->
        <circle cx="65" cy="65" r="60" fill="none" stroke="#0d1b2a" stroke-width="2"/>
        <!-- トラック -->
        <circle cx="65" cy="65" r="50" fill="none" stroke="#0d1b2a" stroke-width="12"/>
        <!-- プログレス -->
        <circle
          id="gauge-arc"
          cx="65" cy="65" r="50"
          fill="none"
          stroke="#00d4ff"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="314.16"
          stroke-dashoffset="314.16"
          transform="rotate(-90 65 65)"
        />
        <!-- 内側グロー（同じ弧を太めで薄く重ねる） -->
        <circle
          id="gauge-glow"
          cx="65" cy="65" r="50"
          fill="none"
          stroke="#00d4ff"
          stroke-width="20"
          stroke-linecap="round"
          stroke-dasharray="314.16"
          stroke-dashoffset="314.16"
          transform="rotate(-90 65 65)"
          opacity="0.15"
        />
        <!-- 中央テキスト -->
        <text id="gauge-pct" x="65" y="59" text-anchor="middle" class="gauge-pct">0.0%</text>
        <text x="65" y="76" text-anchor="middle" class="gauge-label">HEADSHOT</text>
      </svg>
    </div>

    <!-- 統計バー -->
    <div class="stats-row">
      <div class="stat-cell">
        <div class="stat-val" id="stat-kills">0</div>
        <div class="stat-key">KILLS</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-cell">
        <div class="stat-val hs-color" id="stat-hs">0</div>
        <div class="stat-key">HS KILLS</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-cell">
        <div class="stat-val" id="stat-rate">0.0%</div>
        <div class="stat-key">HS RATE</div>
      </div>
    </div>

    <!-- セパレーター -->
    <div class="section-label">RECENT KILLS</div>

    <!-- 直近キルフィード -->
    <div class="kill-feed" id="kill-feed">
      <div class="kill-feed-empty">— waiting for kills —</div>
    </div>

  </div>

  <script src="../config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
